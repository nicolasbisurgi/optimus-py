name: Deploy Documentation

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - 'samples/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  samples-sync-check:
    name: Verify samples are in sync with docs/examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff samples vs docs/examples
        run: |
          set -e
          fail=0
          for f in samples/*.json; do
            base=$(basename "$f")
            target="docs/examples/$base"
            if [ ! -f "$target" ]; then
              echo "::error file=$target::Missing in docs/examples — copy $f to $target"
              fail=1
              continue
            fi
            if ! diff -q "$f" "$target" > /dev/null; then
              echo "::error file=$target::Out of sync with $f — copy $f to $target"
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "Run: cp samples/*.json docs/examples/ && git add docs/examples && git commit"
            exit 1
          fi
          echo "All sample files are in sync."

  build:
    needs: samples-sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install MkDocs dependencies
        run: pip install -r docs-requirements.txt
      - name: Build documentation
        run: mkdocs build --strict
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mkdocs_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
