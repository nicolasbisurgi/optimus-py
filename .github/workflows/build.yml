name: Build Executable

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller optimuspy.spec

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: Build ${{ steps.sha.outputs.short }}
          body: "Automated build from commit ${{ github.sha }}"
          files: dist/optimuspy.exe

  build-linux:
    name: Build on Linux (manylinux_2_28, x86_64)
    needs: build-windows
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          PY=/opt/python/cp311-cp311/bin
          echo "$PY" >> $GITHUB_PATH
          $PY/python -m pip install --upgrade pip
          $PY/pip install pyinstaller
          $PY/pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller optimuspy.spec

      - name: Smoke test the binary
        run: |
          ./dist/optimuspy --help || true
          ldd dist/optimuspy || true
          echo "Highest GLIBC version referenced:"
          objdump -T dist/optimuspy 2>/dev/null | grep GLIBC_ | \
            awk '{print $5}' | sort -V -u | tail -n 5

      - name: Rename binary
        run: mv dist/optimuspy dist/optimuspy-linux

      - name: Get short SHA
        id: sha
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: Build ${{ steps.sha.outputs.short }}
          body: "Automated build from commit ${{ github.sha }}"
          files: dist/optimuspy-linux
